[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papillarray-pts"
version = "0.1.0"
description = "Contactile PapillArray PTS v2.0 串口协议解析与线程化串口工作器的共享核心"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26",
    "pyserial>=3.5,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
